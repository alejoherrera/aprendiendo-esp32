; Leccion 04 - Servidor web con la foto (ver comentarios de 01_blink/platformio.ini)

[env:esp32cam]
platform = espressif32@6.12.0
board = esp32cam
framework = arduino

monitor_speed = 921600
monitor_rts = 0
monitor_dtr = 0
upload_speed = 115200
monitor_filters = esp32_exception_decoder
; Libreria del panel (lib/panel en la raiz del repo): traza, pausa, parametros y WiFi.
lib_extra_dirs = ../../lib
