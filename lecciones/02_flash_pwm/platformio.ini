; Leccion 02 - LED flash con PWM (ver comentarios de 01_blink/platformio.ini)

[env:esp32cam]
platform = espressif32@6.12.0
board = esp32cam
framework = arduino

monitor_speed = 921600
monitor_rts = 0
monitor_dtr = 0
upload_speed = 115200
; Libreria del panel (lib/panel en la raiz del repo): traza de partes, pausa y parametros.
lib_extra_dirs = ../../lib
