; Leccion 01 - Blink en la ESP32-CAM (AI-Thinker)
; Documentacion de este archivo: https://docs.platformio.org/page/projectconf.html

[env:esp32cam]
; Version FIJA de la plataforma: asi todos compilan con el mismo Arduino core (2.0.17).
; En core 3.x cambian APIs (por ejemplo LEDC); no subir sin revisar las lecciones.
platform = espressif32@6.12.0
board = esp32cam
framework = arduino

monitor_speed = 921600
; Con el adaptador ESP32-CAM-MB, las lineas DTR/RTS del puerto serie estan cableadas a
; RESET e IO0. Si el monitor las activa, la placa queda en reset o en modo descarga y "no
; imprime nada". Por eso se apagan.
monitor_rts = 0
monitor_dtr = 0
; Monitor a 921600 (rapido: el panel recibe fotos por aca). La CARGA del programa va a
; 115200: es lenta pero confiable con adaptadores baratos. Si el tuyo aguanta, proba 460800.
upload_speed = 115200
; Libreria del panel (lib/panel en la raiz del repo): traza de partes, pausa y parametros.
lib_extra_dirs = ../../lib
