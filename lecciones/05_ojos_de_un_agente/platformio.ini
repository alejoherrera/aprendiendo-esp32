; Leccion 05 - Ojos de un agente (ver comentarios de 01_blink/platformio.ini)

[env:esp32cam]
platform = espressif32@6.12.0
board = esp32cam
framework = arduino

monitor_speed = 921600
monitor_rts = 0
monitor_dtr = 0
upload_speed = 115200
monitor_filters = esp32_exception_decoder
; Libreria del panel (lib/panel en la raiz del repo): traza, pausa, parametros, WiFi y secretos.
lib_extra_dirs = ../../lib
; Para leer las respuestas JSON de Gemini. Version FIJA: todo el grupo compila lo mismo.
lib_deps = bblanchon/ArduinoJson@7.4.3
