; Leccion 03 - Primera foto (ver comentarios de 01_blink/platformio.ini)
; El perfil esp32cam ya activa la PSRAM (-DBOARD_HAS_PSRAM) y usa la particion huge_app
; (3 MB para el programa): el driver de camara ocupa bastante.

[env:esp32cam]
platform = espressif32@6.12.0
board = esp32cam
framework = arduino

monitor_speed = 921600
monitor_rts = 0
monitor_dtr = 0
upload_speed = 115200
; Si el programa se cae, traduce la direccion del error a archivo:linea.
monitor_filters = esp32_exception_decoder
; Libreria del panel (lib/panel en la raiz del repo): traza de partes, pausa y parametros.
lib_extra_dirs = ../../lib
